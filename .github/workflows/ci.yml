name: CI

# 作業ブランチは pull_request で検査する。push でも動かすと、同じコミットを2回テストし、
# 下の concurrency で順番待ちになって PR の検査が終わるまでの時間が倍になるため、push は main だけにする
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 既定の上限は6時間。Neon への接続が固まると、下の concurrency でほかのブランチの CI も待たされ続けるため、短く切る。
    # 並列化した後のテストは5分前後のため、余裕を見て20分にする
    timeout-minutes: 20
    # テスト用 DB は全ブランチで1つを共有し、テストの開始時にマイグレーションをロックなしで適用する（tests/helpers/test-db.ts）。
    # push と pull_request などが同時に走ると、同じマイグレーションを二重に適用して失敗するため、全ブランチで1つずつ動かす。
    # 途中で止めるとマイグレーションが半端に残るため、実行中のものは取り消さない
    concurrency:
      group: test-database
      cancel-in-progress: false
    steps:
      # 外部 Action はタグの差し替えに影響されないよう commit SHA で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # スキーマを変えたのに bun run db:generate を忘れていないかを確かめる（マイグレーションが無いまま本番に出さないため）。
      # check はマイグレーションどうしの食い違い、generate は新しいファイルが作られないことを見る。
      # どちらも DB に繋がないが、drizzle.config.ts が DATABASE_URL を必須にしているため、繋がらないダミーを渡す
      - name: Check migrations are up to date
        run: |
          bunx drizzle-kit check
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::スキーマに合うマイグレーションがありません。bun run db:generate を実行してコミットしてください"
            exit 1
          fi
        env:
          DATABASE_URL: postgres://unused@localhost/unused
      # wrangler.jsonc を変えたのに bun run cf-typegen を忘れていないかを確かめる。
      # wrangler types は .dev.vars の変数名も型に足すため、ローカルで生成すると .dev.vars の無い CI とは結果が変わる点に注意
      - name: Check worker types are up to date
        run: bunx wrangler types --check
        env:
          WRANGLER_SEND_METRICS: "false"
      # DB を使うテストはテスト用の Neon ブランチに繋ぐ（開発用・本番用の DB には繋がない）
      - name: Apply migrations to the test database
        run: bun tests/helpers/migrate-test-db.ts
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # テストの時間はほぼ Neon との往復待ちのため、テストファイルを6つずつ並列に動かす（1つずつだと16分以上かかった）。
      # ファイルごとに使う年とユーザーのアドレスが分かれているため、同時に動かしてもデータはぶつからない。
      # 重いファイルが最後に残って待たされないよう、大きいファイルから始める（ls -S）。
      # ログが混ざらないよう、ファイルごとに出力をためて、終わってからまとめて出す。1つでも失敗すれば xargs が失敗を返す
      - name: Test
        run: |
          find tests -name '*.test.ts' -exec ls -S {} + \
            | xargs -P 6 -n 1 sh -c 'output=$(bun test "$1" 2>&1); status=$?; printf "%s\n" "$output"; exit $status' _
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - run: bun run build
        env:
          WRANGLER_SEND_METRICS: "false"
