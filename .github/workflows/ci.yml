name: CI

# 作業ブランチは pull_request で検査する。push でも動かすと、同じコミットを2回テストし、
# 下の concurrency で順番待ちになって PR の検査が終わるまでの時間が倍になるため、push は main だけにする
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # テスト用 DB は全ブランチで1つを共有し、テストの開始時にマイグレーションをロックなしで適用する（tests/helpers/test-db.ts）。
    # push と pull_request などが同時に走ると、同じマイグレーションを二重に適用して失敗するため、全ブランチで1つずつ動かす。
    # 途中で止めるとマイグレーションが半端に残るため、実行中のものは取り消さない
    concurrency:
      group: test-database
      cancel-in-progress: false
    steps:
      # 外部 Action はタグの差し替えに影響されないよう commit SHA で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # DB を使うテストはテスト用の Neon ブランチに繋ぐ（開発用・本番用の DB には繋がない）
      # CI には .dev.vars.test が無いが、bun は無いファイルを読み飛ばすので、ローカルと同じ bun run test で動く
      - run: bun run test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - run: bun run build
        env:
          WRANGLER_SEND_METRICS: "false"
